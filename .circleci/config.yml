version: 2.1

orbs:
  # orb info: https://circleci.com/developer/orbs/orb/rynkowsg/checkout
  checkout: rynkowsg/checkout@0.3.0
  # orb info: https://circleci.com/developer/orbs/orb/rynkowsg/mise
  # changelog: https://github.com/rynkowsg/mise-orb/blob/main/CHANGELOG.md
  mise: rynkowsg/mise@0.1.1
  # orb info: https://circleci.com/developer/orbs/orb/rynkowsg/rynkowsg
  rynkowsg: rynkowsg/rynkowsg@0.5.0

jobs:
  lint:
    executor: rynkowsg/docker_x86_cimg_base
    steps:
      - checkout/checkout: {depth: 1}
      - mise/setup:
          # Keep mise_version in sync with the mise version in mise.toml.
          mise_version: v2026.11.11 # https://github.com/jdx/mise/releases
          # java is here because babashka needs it, and babashka runs sosh.
          tools: >-
            babashka java
            shellcheck
            shfmt
      - rynkowsg/install_sosh: { version: "v0.2.0" }
      - run: make lint
      - run: make format-check

  test:
    executor: rynkowsg/docker_x86_cimg_base
    steps:
      - checkout/checkout: {depth: 1}
      - mise/setup:
          # Keep mise_version in sync with the mise version in mise.toml.
          mise_version: v2026.11.11 # https://github.com/jdx/mise/releases
          # java is here because babashka needs it, and babashka runs sosh.
          tools: >-
            babashka java
            bats
      - rynkowsg/install_sosh: { version: "v0.2.0" }
      - run: make test

workflows:
  main:
    jobs:
      - lint
      - test
